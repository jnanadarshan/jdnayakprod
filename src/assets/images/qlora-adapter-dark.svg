<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="QLoRA diagram: input x passes through a frozen 4-bit weight matrix and, in parallel, two small trainable matrices A and B whose output is added"><title>QLoRA diagram: input x passes through a frozen 4-bit weight matrix and, in parallel, two small trainable matrices A and B whose output is added</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2bb09f"/></marker></defs><text x="60" y="56" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="800" fill="#f1f5f9" text-anchor="start">QLoRA: freeze the big matrix, train two thin ones</text><text x="60" y="84" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">One attention projection in Qwen3-1.7B. The same pattern repeats on 7 projections in each of 28 layers.</text><rect x="60" y="205" width="90" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/><text x="105" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle">x</text><rect x="230" y="130" width="330" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="395" y="168" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">W  (frozen, 4-bit NF4)</text><text x="395" y="194" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">2048 × 2048 = 4.19 M numbers</text><text x="395" y="214" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">never updated</text><rect x="230" y="270" width="150" height="84" rx="10" fill="#0b2e2b" stroke="#2bb09f" stroke-width="1.5"/><text x="305" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#2bb09f" text-anchor="middle">A</text><text x="305" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#f1f5f9" text-anchor="middle">2048 → 16</text><rect x="410" y="270" width="150" height="84" rx="10" fill="#0b2e2b" stroke="#2bb09f" stroke-width="1.5"/><text x="485" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#2bb09f" text-anchor="middle">B</text><text x="485" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#f1f5f9" text-anchor="middle">16 → 2048</text><line x1="380" y1="312" x2="406" y2="312" stroke="#2bb09f" stroke-width="2" marker-end="url(#ah1)"/><text x="395" y="380" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#2bb09f" text-anchor="middle">trainable: 65,536 numbers (1.6%)</text><path d="M150,235 H190 V180 H226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><path d="M190,235 V312 H226" fill="none" stroke="#2bb09f" stroke-width="2" marker-end="url(#ah1)"/><path d="M560,180 H630 V218" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><path d="M560,312 H630 V252" fill="none" stroke="#2bb09f" stroke-width="2" marker-end="url(#ah1)"/><circle cx="630" cy="235" r="16" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/><text x="630" y="241" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">+</text><line x1="646" y1="235" x2="690" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="694" y="205" width="70" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/><text x="729" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle">y</text><text x="60" y="420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#f1f5f9" text-anchor="start">y = W·x + (α/r)·B·(A·x)</text><text x="60" y="448" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">B starts at zero, so at step 0 the model is exactly the base model.</text><rect x="810" y="130" width="240" height="250" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/><text x="832" y="174" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#2bb09f" text-anchor="start">17.4 M</text><text x="832" y="194" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">trainable parameters, ≈1%</text><text x="832" y="230" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#2bb09f" text-anchor="start">~70 MB</text><text x="832" y="250" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">adapter file vs 3.4 GB model</text><text x="832" y="286" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#2bb09f" text-anchor="start">1.3 GB</text><text x="832" y="306" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">4-bit base weights in memory</text><text x="832" y="342" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#2bb09f" text-anchor="start">4.8 GB</text><text x="832" y="362" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">peak GPU memory, first run</text></svg>
