<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" role="img" aria-label="Timeline of AI mathematics milestones in 2026, from Erdős problem 90 to the claimed Riemann hypothesis proof"><title>Timeline of AI mathematics milestones in 2026, from Erdős problem 90 to the claimed Riemann hypothesis proof</title><text x="60.0" y="56.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="800" fill="#1e293b" text-anchor="start">2026: AI goes from math student to math researcher</text><text x="60.0" y="84.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">Selected milestones. Most are company announcements; the newest are still under expert review.</text><line x1="70" y1="290" x2="1030" y2="290" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><line x1="120.0" y1="290" x2="120.0" y2="244.0" stroke="#009688" stroke-width="2" stroke-dasharray="3 4"/><circle cx="120.0" cy="290" r="8" fill="#009688" stroke="#f1f5f9" stroke-width="3"/><text x="120.0" y="182.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" fill="#009688" text-anchor="middle" letter-spacing="1">MAY</text><text x="120.0" y="206.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Erdős #90 solved</text><text x="120.0" y="230.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">OpenAI · unit distance</text><line x1="258.3" y1="290" x2="258.3" y2="336.0" stroke="#3F51B5" stroke-width="2" stroke-dasharray="3 4"/><circle cx="258.3" cy="290" r="8" fill="#3F51B5" stroke="#f1f5f9" stroke-width="3"/><text x="258.3" y="358.0" font-family="ui-monospace,SFMono-Regular,Menlo,Conso