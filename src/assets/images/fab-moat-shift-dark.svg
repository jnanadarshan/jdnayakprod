<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-label="The fab moat shifts from tribal know-how to data and learning-loop speed"><title>The fab moat shifts from tribal know-how to data and learning-loop speed</title><defs><marker id="ah-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009688"/></marker></defs><rect x="60" y="60" width="390" height="270" rx="20" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/><text x="90.0" y="104.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="2">TODAY'S MOAT</text><text x="90.0" y="144.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="30" font-weight="800" fill="#f1f5f9" text-anchor="start">Tribal know-how</text><rect x="90" y="187" width="10" height="10" fill="#94a3b8"/><text x="112.0" y="198.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start">Senior engineers' intuition</text><rect x="90" y="227" width="10" height="10" fill="#94a3b8"/><text x="112.0" y="238.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start">Recipe histories, excursion notes</text><rect x="90" y="267" width="10" height="10" fill="#94a3b8"/><text x="112.0" y="278.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start">Decades of yield learning</text><rect x="650" y="60" width="390" height="270" rx="20" fill="#1e293b" stroke="#009688" stroke-width="2.5"/><text x="680.0" y="104.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800" fill="#009688" text-anchor="start" letter-spacing="2">TOMORROW'S MOAT</text><text x="680.0" y="144.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="30" font-weight="800" fill="#f1f5f9" text-anchor="start">Data + loop speed</text><rect x="680" y="187" width="10" height="10" fill="#009688"/><text x="702.0" y="198.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start">Wafers per year = training data</text><rect x="680" y="227" width="10" height="10" fill="#009688"/><text x="702.0" y="238.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start">Connected MES, SPC, FDC data</text><rect x="680" y="267" width="10" height="10" fill="#009688"/><text x="702.0" y="278.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start">Hypothesis-to-answer time</text><line x1="470" y1="195" x2="628" y2="195" stroke="#009688" stroke-width="5" stroke-linecap="round" marker-end="url(#ah-t)"/><rect x="518" y="138" width="64" height="34" rx="17" fill="#009688"/><text x="550.0" y="161.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">AI</text><text x="550.0" y="385.0" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#f1f5f9" text-anchor="middle">AI doesn't drain the moat. It moves it.</text></svg>
