<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-label="Five-step experiment loop: facts, training set, QLoRA run, probes, scorecard, then change one variable and repeat"><title>Five-step experiment loop: facts, training set, QLoRA run, probes, scorecard, then change one variable and repeat</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009688"/></marker></defs><text x="60" y="56" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="800" fill="#1e293b" text-anchor="start">One experiment, one change</text><text x="60" y="84" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">Every run goes through the same loop. Only one variable changes between runs, so a score change has one cause.</text><rect x="60" y="140" width="180" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="88" cy="172" r="15" fill="#009688"/><text x="88" y="177.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="112" y="178" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Facts</text><text x="78" y="216" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Hand-written SECS-II</text><text x="78" y="238" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">reference table,</text><text x="78" y="260" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">in my own words</text><line x1="244" y1="215.0" x2="256" y2="215.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="260" y="140" width="180" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="288" cy="172" r="15" fill="#009688"/><text x="288" y="177.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="312" y="178" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Training set</text><text x="278" y="216" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Many phrasings</text><text x="278" y="238" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">per fact, plus</text><text x="278" y="260" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">general replay</text><line x1="444" y1="215.0" x2="456" y2="215.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="460" y="140" width="180" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="488" cy="172" r="15" fill="#009688"/><text x="488" y="177.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="512" y="178" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">QLoRA run</text><text x="478" y="216" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Free T4 GPU,</text><text x="478" y="238" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">4-bit base model,</text><text x="478" y="260" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">LoRA rank 16</text><line x1="644" y1="215.0" x2="656" y2="215.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="660" y="140" width="180" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="688" cy="172" r="15" fill="#009688"/><text x="688" y="177.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="712" y="178" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Probes</text><text x="678" y="216" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Seen, held-out and</text><text x="678" y="238" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">general questions,</text><text x="678" y="260" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">same every run</text><line x1="844" y1="215.0" x2="856" y2="215.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="860" y="140" width="180" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="888" cy="172" r="15" fill="#009688"/><text x="888" y="177.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="912" y="178" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Scorecard</text><text x="878" y="216" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Logged with</text><text x="878" y="238" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">every run; failures</text><text x="878" y="260" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">are kept</text><path d="M950.0,294 V340 H150.0 V298" fill="none" stroke="#009688" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah1)"/><rect x="360.0" y="326" width="380" height="28" rx="14" fill="#f8fafc"/><text x="550.0" y="345" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="600" fill="#009688" text-anchor="middle">Read the failures, change one thing, repeat</text></svg>
